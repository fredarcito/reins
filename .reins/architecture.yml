# Architecture of this repo itself, checked by its own `reins check` (pnpm self-check and CI).
version: 1
adapters: [js]

# Example apps and test fixtures contain intentional violations and their own aliases.
ignore: ["examples/**", "packages/*/test/fixtures/**", "packages/adapters/*/test/fixtures/**"]

# Top to bottom: repo tooling may use everything; the CLI may use adapters and core; adapters may use core;
# core uses neither. No package may import scripts/: they are not published.
layers:
  - { name: tooling,  paths: ["scripts/**"] }
  - { name: cli,      paths: ["packages/cli/src/**"] }
  - { name: adapters, paths: ["packages/adapters/*/src/**", "packages/adapters/*/rules/**", "packages/adapters/*/presets/**"] }
  - { name: core,     paths: ["packages/core/src/**"] }

# Adapters may only use the core through its contract (also enforced by the "exports" field).
domains:
  core: { paths: ["packages/core/src/**"], public_api: ["packages/core/src/index.js", "packages/core/src/contract/index.js"] }

rules:
  - { id: layer-direction, severity: error }
  - { id: domain-boundary, severity: error }
  - { id: no-cycles,       severity: error }
  - { id: integrity,       severity: warn }

allow: []
