# Preset for a Vite + React app (plain JS/JSX or TypeScript).
# `reins init` uses `layers` as a starting point and keeps only the folders that exist.
# `entries` are entry points by convention: never reported as orphans.
description: Vite + React single page app

layers:
  - { name: app,        paths: ["src/main.{js,jsx,ts,tsx}", "src/App.{js,jsx,ts,tsx}", "src/pages/**", "src/routes/**", "src/app/**"] }
  - { name: features,   paths: ["src/features/**", "src/modules/**"] }
  - { name: components, paths: ["src/components/**", "src/ui/**"] }
  - { name: shared,     paths: ["src/hooks/**", "src/lib/**", "src/utils/**", "src/services/**", "src/api/**", "src/store/**", "src/types/**", "src/constants/**"] }

domains_from: ["src/features/*", "src/modules/*"]

entries:
  - "src/main.{js,jsx,ts,tsx}"
  - "vite.config.*"
  - "**/*.{test,spec}.{js,jsx,ts,tsx}"
  - "**/*.stories.{js,jsx,ts,tsx}"
